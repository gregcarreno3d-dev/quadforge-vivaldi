name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,       os: ubuntu-latest,  exe: forge }
          - { name: windows,     os: windows-latest, exe: forge.exe }
          - { name: macos-arm64, os: macos-14,       exe: forge }
          - { name: macos-x64,   os: macos-15-intel,      exe: forge }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install tools
        run: python -m pip install ziglang numpy scikit-image
      - name: Build the engine natively
        run: python tools/build.py ${{ matrix.name }}
      - name: Engine hard cases (29 models)
        shell: bash
        env:
          FORGE_ENGINE: ${{ github.workspace }}/engine/bin/${{ matrix.name }}/${{ matrix.exe }}
        run: python quadforge/devtools/engine_tests/t08_hard_cases.py
      - name: Engine robustness (quick)
        shell: bash
        env:
          FORGE_ENGINE: ${{ github.workspace }}/engine/bin/${{ matrix.name }}/${{ matrix.exe }}
        run: python quadforge/devtools/engine_tests/t07_robustness.py --quick
      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.name }}
          path: engine/bin/${{ matrix.name }}/${{ matrix.exe }}

  addon:
    name: Add-on tests in Blender (bpy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install
        run: python -m pip install ziglang numpy scikit-image bpy
      - name: Build Linux engine
        run: |
          python tools/build.py linux
          mkdir -p quadforge/bin/linux
          cp engine/bin/linux/forge quadforge/bin/linux/forge
      - name: Add-on tests
        run: |
          python quadforge/tests/blender_forge_test.py
          python quadforge/tests/blender_integration_test.py
      # The matrix test (67 shapes x settings) is reported but does not fail the build: one scenario
      # ("block-holes", symmetry X + hard edges) left 3 open edges on the centre seam once on GitHub's runners and
      # could not be reproduced in about 100 local runs of that scenario. See "Known issues" in quadforge/docs/STATUS_AND_LIMITS.md.
      - name: Add-on matrix test (reported, not blocking)
        continue-on-error: true
        run: python quadforge/tests/blender_matrix_test.py

  blender-versions:
    name: Add-on on Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { blender: "4.2.0",  python: "3.11" }
          - { blender: "4.5.15", python: "3.11" }
          - { blender: "5.1.2",  python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: python -m pip install ziglang numpy scipy scikit-image bpy==${{ matrix.blender }}
      - name: Build Linux engine
        run: |
          python tools/build.py linux
          mkdir -p quadforge/bin/linux
          cp engine/bin/linux/forge quadforge/bin/linux/forge
      # run_in_bpy.py ends the process with os._exit: the bpy module can crash or hang at interpreter shutdown on 4.2 and 4.5.
      - name: Add-on tests
        run: |
          for t in blender_forge_test blender_integration_test blender_zones_test blender_hard_test blender_preview_test blender_zone_detail_test blender_subdiv_test blender_head_test; do
            python quadforge/tests/run_in_bpy.py quadforge/tests/$t.py
          done
